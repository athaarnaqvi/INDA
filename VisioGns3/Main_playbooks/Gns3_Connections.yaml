---
- name: Create NLP-based connections in GNS3
  hosts: localhost
  gather_facts: no

  vars:
    gns3_server: "http://127.0.0.1:3080"
    project_name: "nlp_topology_20251209_174138"

  tasks:
    - name: Get all projects
      uri:
        url: "{{ gns3_server }}/v2/projects"
        method: GET
        return_content: yes
      register: gns3_projects

    - name: Set project ID
      set_fact:
        project_id: "{{ (gns3_projects.json | selectattr('name','equalto',project_name) | list)[0].project_id }}"
      when: gns3_projects.json | selectattr('name','equalto',project_name) | list | length > 0

    - name: Open project if needed
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/open"
        method: POST
        status_code: [200, 201]

    - name: Get nodes
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/nodes"
        method: GET
        return_content: yes
      register: gns3_nodes

    - name: Connect switch1 to server1
      vars:
        node_map: "{{ gns3_nodes.json | items2dict(key_name='name', value_name='node_id') }}"
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        status_code: [200, 201]
        body:
          nodes:
            - node_id: "{{ node_map['switch1'] }}"
              adapter_number: 0
              port_number: 0
            - node_id: "{{ node_map['server1'] }}"
              adapter_number: 0
              port_number: 0

    - name: Connect switch1 to server2
      vars:
        node_map: "{{ gns3_nodes.json | items2dict(key_name='name', value_name='node_id') }}"
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        status_code: [200, 201]
        body:
          nodes:
            - node_id: "{{ node_map['switch1'] }}"
              adapter_number: 0
              port_number: 1
            - node_id: "{{ node_map['server2'] }}"
              adapter_number: 0
              port_number: 0

    - name: Connect switch1 to server3
      vars:
        node_map: "{{ gns3_nodes.json | items2dict(key_name='name', value_name='node_id') }}"
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        status_code: [200, 201]
        body:
          nodes:
            - node_id: "{{ node_map['switch1'] }}"
              adapter_number: 0
              port_number: 2
            - node_id: "{{ node_map['server3'] }}"
              adapter_number: 0
              port_number: 0

    - name: Connect switch1 to server4
      vars:
        node_map: "{{ gns3_nodes.json | items2dict(key_name='name', value_name='node_id') }}"
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        status_code: [200, 201]
        body:
          nodes:
            - node_id: "{{ node_map['switch1'] }}"
              adapter_number: 0
              port_number: 3
            - node_id: "{{ node_map['server4'] }}"
              adapter_number: 0
              port_number: 0

    - name: Connect switch1 to server5
      vars:
        node_map: "{{ gns3_nodes.json | items2dict(key_name='name', value_name='node_id') }}"
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        status_code: [200, 201]
        body:
          nodes:
            - node_id: "{{ node_map['switch1'] }}"
              adapter_number: 0
              port_number: 4
            - node_id: "{{ node_map['server5'] }}"
              adapter_number: 0
              port_number: 0
