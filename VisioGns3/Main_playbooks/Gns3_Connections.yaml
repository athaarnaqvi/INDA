---
- name: Create Architecture-based connections in GNS3
  hosts: localhost
  gather_facts: no

  vars:
    gns3_server: "http://localhost:3080"
    project_name: "architecture_topology_20260312_205922"

  tasks:
    - name: Get all projects
      uri:
        url: "{{ gns3_server }}/v2/projects"
        method: GET
        return_content: yes
      register: gns3_projects

    - name: Set project ID
      set_fact:
        project_id: "{{ (gns3_projects.json | selectattr('name','equalto',project_name) | list)[0].project_id }}"
      when: gns3_projects.json | selectattr('name','equalto',project_name) | list | length > 0

    - name: Open project if needed
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/open"
        method: POST
        status_code: [200, 201]

    - name: Get nodes
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/nodes"
        method: GET
        return_content: yes
      register: gns3_nodes

    - name: Connect pc_f1_r1_u1 to access_switch_f1_r1
      vars:
        node_map: "{{ gns3_nodes.json | items2dict(key_name='name', value_name='node_id') }}"
      uri:
        url: "{{ gns3_server }}/v2/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        status_code: [200, 201]
        body:
          nodes:
            - node_id: "{{ node_map['pc_f1_r1_u1'] }}"
              adapter_number: 0
              port_number: 0
            - node_id: "{{ node_map['access_switch_f1_r1'] }}"
              adapter_number: 0
              port_number: 0

