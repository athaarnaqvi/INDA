          }
        body_format: json
        status_code: 201
    - name: Add ap_f1_1
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
            "name": "ap_f1_1",
            "x": 100,
            "y": -250,
            "compute_id": "local",
              "node_type": "ethernet_switch",
              "symbol": ":/symbols/ethernet_switch.svg",
              "template_id": "1966b864-93e7-32d5-965f-001384eec461"
          }
        body_format: json
        status_code: 201
    - name: Add ap_f1_2
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
