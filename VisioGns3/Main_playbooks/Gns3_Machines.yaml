              "template_id": "1966b864-93e7-32d5-965f-001384eec461"
          }
        body_format: json
        status_code: 201
    - name: Draw Floor 1 boundary
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/drawings"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body: |
          {
            "svg": "<ellipse cx='150' cy='-200' rx='300' ry='300' style='fill:none;stroke:blue;stroke-width:3'/>",
            "x": -50,
