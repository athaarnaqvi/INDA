- hosts: localhost
  gather_facts: no
  vars:
    gns3_url: "http://localhost:3080"
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Create Architecture GNS3 project
      uri:
        url: "{{ gns3_url }}/v2/projects"
        method: POST
        headers:
          Content-Type: "application/json"
        body:
          name: "architecture_topology_20260314_140747"
        body_format: json
        status_code: 201
      register: project_result
    - name: Add core_router_1
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
            "name": "core_router_1",
            "x": -750,
            "y": -400,
            "compute_id": "local",
              "node_type": "qemu",
              "symbol": ":/symbols/router.svg",
              "template_id": "158704ed-0665-4328-a56b-880b1733b70d",
              "first_port_name": "mgmt 1/1/1",
              "port_name_format": "eth 1/1/{port1}",
              "properties": {"adapter_type": "e1000", "adapters": 10, "console_type": "telnet", "cpus": 1, "hda_disk_image": "OS10-Disk-1.0.0.vmdk", "hda_disk_interface": "sata", "hdb_disk_image": "OS10-Installer-10.5.5.5.105.vmdk", "hdb_disk_interface": "virtio", "hdc_disk_image": "OS10-platform-N3248TE-10.5.5.5.105.vmdk", "hdc_disk_interface": "virtio", "ram": 4096, "boot_priority": "d", "qemu_path": "/usr/bin/qemu-system-x86_64", "replicate_network_connection_state": true}
          }
        body_format: json
        status_code: 201
    - name: Add dhcp_server
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
            "name": "dhcp_server",
            "x": -600,
            "y": -400,
            "compute_id": "local",
              "node_type": "qemu",
              "symbol": ":/symbols/qemu_guest.svg",
              "template_id": "3a18653d-2ea5-4c08-8d4c-cd2478f741fd",
              "first_port_name": "",
              "port_name_format": "Ethernet{0}",
              "properties": {"adapter_type": "e1000", "adapters": 1, "console_type": "telnet", "cpus": 1, "hda_disk_image": "/home/athaar/GNS3/images/QEMU/alpine-virt-3.18.4.qcow2", "hda_disk_interface": "ide", "hdb_disk_image": "", "hdb_disk_interface": "none", "hdc_disk_image": "", "hdc_disk_interface": "none", "ram": 256, "boot_priority": "c", "qemu_path": "/bin/qemu-system-x86_64", "replicate_network_connection_state": true}
          }
        body_format: json
        status_code: 201
    - name: Add dns_server
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
            "name": "dns_server",
            "x": -750,
            "y": -250,
            "compute_id": "local",
              "node_type": "qemu",
              "symbol": ":/symbols/qemu_guest.svg",
              "template_id": "3a18653d-2ea5-4c08-8d4c-cd2478f741fd",
              "first_port_name": "",
              "port_name_format": "Ethernet{0}",
              "properties": {"adapter_type": "e1000", "adapters": 1, "console_type": "telnet", "cpus": 1, "hda_disk_image": "/home/athaar/GNS3/images/QEMU/alpine-virt-3.18.4.qcow2", "hda_disk_interface": "ide", "hdb_disk_image": "", "hdb_disk_interface": "none", "hdc_disk_image": "", "hdc_disk_interface": "none", "ram": 256, "boot_priority": "c", "qemu_path": "/bin/qemu-system-x86_64", "replicate_network_connection_state": true}
          }
        body_format: json
        status_code: 201
    - name: Add internet_cloud
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
            "name": "internet_cloud",
            "x": -600,
            "y": -250,
            "compute_id": "local",
              "node_type": "cloud",
              "symbol": ":/symbols/cloud.svg",
              "template_id": "39e257dc-8412-3174-b6b3-0ee3ed6a43e9"
          }
        body_format: json
        status_code: 201
    - name: Add firewall_1
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
          Content-Type: "application/json"
        body: |
          {
            "name": "firewall_1",
            "x": -750,
            "y": -100,
            "compute_id": "local",
              "node_type": "qemu",
              "symbol": ":/symbols/firewall.svg",
              "template_id": "b2e0ff5c-375a-434a-ab3a-2e987a84f81d",
              "first_port_name": "",
              "port_name_format": "em{0}",
              "properties": {"adapter_type": "e1000", "adapters": 6, "console_type": "vnc", "cpus": 1, "hda_disk_image": "empty100G.qcow2", "hda_disk_interface": "virtio", "hdb_disk_image": "", "hdb_disk_interface": "none", "hdc_disk_image": "", "hdc_disk_interface": "none", "ram": 2048, "boot_priority": "c", "qemu_path": "/usr/bin/qemu-system-x86_64", "replicate_network_connection_state": true}
          }
        body_format: json
        status_code: 201
    - name: Draw Floor 0 boundary
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/drawings"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body: |
          {
            "svg": "<ellipse cx='-550' cy='-200' rx='300' ry='300' style='fill:none;stroke:blue;stroke-width:3'/>",
            "x": -750,
            "y": -400,
            "z": -1,
            "locked": false
          }
        status_code: 201

    - name: Label Floor 0
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/drawings"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body: |
          {
            "svg": "<text font-size='36' fill='red'>Floor 0</text>",
            "x": -650,
            "y": -550,
            "z": 2
          }
        status_code: 201
    - name: Add dist_switch_f1
      uri:
        url: "{{ gns3_url }}/v2/projects/{{ project_result.json.project_id }}/nodes"
        method: POST
        headers:
