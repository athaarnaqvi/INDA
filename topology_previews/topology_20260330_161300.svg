<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 800"
     version="1.1"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%; height:auto; border:1px solid #ddd;">
    
    <defs>
        <!-- Arrow marker -->
        <marker id="arrowhead" markerWidth="13" markerHeight="13" 
                refX="12" refY="6" orient="auto">
            <polygon points="0 0, 13 6, 0 12" fill="#666666" />
        </marker>
        
        <!-- Styles -->
        <style>
            .device { cursor: pointer; }
            .device:hover { opacity: 0.9; filter: drop-shadow(0 0 4px rgba(0,0,0,0.3)); }
            .connection { pointer-events: none; }
            text { font-family: Arial, Helvetica, sans-serif; }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="800" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    
    <!-- Grid -->
    <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#F5F5F5" stroke-width="0.5"/>
        </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#grid)" />
    
    <!-- Title -->
    <text x="600.0" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">
        Network Topology
    </text>
    <text x="600.0" y="58" text-anchor="middle" font-size="11" fill="#999">
        2026-03-30 16:13:00 | Devices: 0 | Links: 0
    </text>
    
    <!-- Connections -->
    <g id="connections">

    </g>
    
    <!-- Nodes -->
    <g id="nodes">

    </g>
    
    <!-- Legend -->
    <g id="legend">
        <rect x="20" y="80" width="180" height="220" fill="#F9F9F9" 
              stroke="#AAA" stroke-width="1.5" rx="4" opacity="0.96" />
        <text x="110" y="102" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">
            Device Types
        </text>

        <rect x="30" y="116" width="13" height="13" 
              fill="#87CEEB" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="123" font-size="10" fill="#333">ethernet_switch</text>

        <rect x="30" y="136" width="13" height="13" 
              fill="#FFB6C1" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="143" font-size="10" fill="#333">qemu</text>

        <rect x="30" y="156" width="13" height="13" 
              fill="#98FB98" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="163" font-size="10" fill="#333">router</text>

        <rect x="30" y="176" width="13" height="13" 
              fill="#FFE4B5" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="183" font-size="10" fill="#333">cloud</text>

        <rect x="30" y="196" width="13" height="13" 
              fill="#DDA0DD" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="203" font-size="10" fill="#333">nat</text>

        <rect x="30" y="216" width="13" height="13" 
              fill="#F0E68C" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="223" font-size="10" fill="#333">vpcs</text>

        <rect x="30" y="236" width="13" height="13" 
              fill="#FF6347" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="243" font-size="10" fill="#333">firewall</text>

        <rect x="30" y="256" width="13" height="13" 
              fill="#DEB887" stroke="#333" stroke-width="1" rx="2" />
        <text x="50" y="263" font-size="10" fill="#333">hub</text>

    </g>

</svg>
